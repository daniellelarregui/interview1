<!-- templates/books.html -->

<!DOCTYPE html>
<html>
<head>
    <title>Books</title>
</head>
<body>
    <!-- INTENTIONALLY VULNERABLE USE: do NOT escape search -->
    {% if search %}
        <p>You searched for: {{ search|safe }}</p>
    {% endif %}

    <ul>
        {% for book in books %}
            <li>{{ book.name }} by {{ book.author }}</li>
        {% endfor %}
    </ul>
</body>
</html>
